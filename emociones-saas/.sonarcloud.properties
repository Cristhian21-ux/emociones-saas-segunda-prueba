# Configuración del Análisis Automático de SonarQube Cloud.
# (El análisis automático lee ESTE archivo; ignora sonar-project.properties.)

# Código que escribe el equipo: backend (Laravel), frontend (React) e ia-service (Python).
sonar.sources=backend/app,backend/routes,backend/database,frontend/src,ia-service/app
sonar.tests=backend/tests,frontend/src/__tests__,frontend/cypress,ia-service/tests

# No analizar lo que no es código propio:
#  - backend/public/spa: interfaz React ya compilada (minificada, generada por Vite).
#  - vendor, node_modules, dist: dependencias y salidas de compilación.
sonar.exclusions=backend/public/spa/**,frontend/src/__tests__/**,**/vendor/**,**/node_modules/**,**/dist/**,backend/storage/**,backend/bootstrap/cache/**

sonar.sourceEncoding=UTF-8
